# PersonaAI Configuration File
# =====================================================

[APP]
# Application Settings
APP_NAME = PersonaAI
APP_VERSION = 1.0.0
DEBUG = false
LOG_LEVEL = INFO

[STREAMLIT]
# Streamlit UI Settings
PAGE_TITLE = PersonaAI - Recommendation Engine
PAGE_ICON = ✨
LAYOUT = wide
THEME = dark
MENU_ENABLED = true

[RECOMMENDATION]
# Algorithm Weights (must sum to 1.0)
COLLABORATIVE_WEIGHT = 0.6
CONTENT_WEIGHT = 0.4

# Algorithm Parameters
MIN_SIMILARITY_THRESHOLD = 0.3
MIN_INTERACTIONS_FOR_COLLAB = 5
MAX_SIMILAR_USERS = 10
MAX_RECOMMENDATIONS = 20

# Content-based Parameters
USE_ITEM_FEATURES = true
FEATURE_SCALING = standard
SIMILARITY_METRIC = cosine

# Trending Settings
TRENDING_WINDOW_DAYS = 30
TRENDING_DECAY_LAMBDA = 0.1

[PERSONALIZATION]
# Cold Start Strategy
COLD_START_STRATEGY = popularity  # options: popularity, demographic, content, hybrid
NEW_USER_INTERACTIONS_THRESHOLD = 5
NEW_ITEM_POPULARITY_THRESHOLD = 100

# Freshness & Novelty
FRESHNESS_WEIGHT = 0.3
NOVELTY_WEIGHT = 0.2
SERENDIPITY_WEIGHT = 0.1

# User Profile
PROFILE_UPDATE_FREQUENCY = hourly
PROFILE_CACHE_HOURS = 24
IMPLICIT_FEEDBACK = true

[DIVERSITY]
# Diversity Settings
ENABLE_DIVERSITY_CONSTRAINT = true
MIN_CATEGORY_DIVERSITY = 0.4
LONG_TAIL_RATIO = 0.3

# Gini Coefficient for Fair Distribution
MAX_GINI_COEFFICIENT = 0.5

[EVALUATION]
# Metrics Calculation
METRICS_K = 10
CALCULATE_COVERAGE = true
CALCULATE_DIVERSITY = true
CALCULATE_NOVELTY = true
CALCULATE_SERENDIPITY = true

# Performance Evaluation
ENABLE_A_B_TESTING = false
TRAIN_TEST_SPLIT = 0.8
CROSS_VALIDATION_FOLDS = 5

[API]
# API Configuration
API_TIMEOUT = 10
API_RETRY_ATTEMPTS = 3
API_RETRY_DELAY = 1
API_CACHE_DURATION = 3600  # seconds

# Rate Limiting
RATE_LIMIT_REQUESTS = 100
RATE_LIMIT_WINDOW = 3600  # seconds

# Async Settings
ENABLE_ASYNC_APIS = true
MAX_CONCURRENT_REQUESTS = 5
CONNECTION_POOL_SIZE = 10

[TMDB_API]
# The Movie Database
TMDB_BASE_URL = https://api.themoviedb.org/3
TMDB_IMAGE_BASE = https://image.tmdb.org/t/p/w500
TMDB_API_KEY = ${TMDB_API_KEY}  # Set via environment variable
TMDB_LANGUAGE = en-US
TMDB_TRENDING_WINDOW = week  # day or week

[SPOTIFY_API]
# Spotify API
SPOTIFY_BASE_URL = https://api.spotify.com/v1
SPOTIFY_AUTH_URL = https://accounts.spotify.com/api/token
SPOTIFY_CLIENT_ID = ${SPOTIFY_CLIENT_ID}
SPOTIFY_CLIENT_SECRET = ${SPOTIFY_CLIENT_SECRET}
SPOTIFY_COUNTRY = US
SPOTIFY_MARKET = US

[NEWS_API]
# News API
NEWS_API_BASE = https://newsapi.org/v2
NEWS_API_KEY = ${NEWS_API_KEY}
NEWS_DEFAULT_LANGUAGE = en
NEWS_DEFAULT_COUNTRY = us
NEWS_SORT_BY = relevancy  # relevancy, popularity, publishedAt

[DATABASE]
# Database Configuration
DATABASE_TYPE = sqlite  # sqlite, postgresql, mongodb
DATABASE_URL = sqlite:///personaai.db
DATABASE_POOL_SIZE = 10
DATABASE_ECHO_SQL = false

# Cache Configuration
CACHE_TYPE = redis  # redis, memcached, simple
CACHE_REDIS_URL = redis://localhost:6379/0
CACHE_TTL = 3600

[LOGGING]
# Logging Configuration
LOG_FILE = personaai.log
LOG_MAX_BYTES = 10485760  # 10MB
LOG_BACKUP_COUNT = 10
LOG_FORMAT = %(asctime)s - %(name)s - %(levelname)s - %(message)s

[SECURITY]
# Security Settings
ENABLE_AUTH = false
SECRET_KEY = ${SECRET_KEY}
API_KEY_ROTATION_DAYS = 90
ENABLE_HTTPS = false

[UI]
# User Interface Settings
ITEMS_PER_PAGE = 10
THEME_PRIMARY_COLOR = #00D9FF
THEME_SECONDARY_COLOR = #FF006E
THEME_ACCENT_COLOR = #8338EC
DARK_BG_COLOR = #0a0e27
CARD_BG_COLOR = #1a1f3a

# Feature Flags
SHOW_ALGORITHM_DETAILS = true
SHOW_USER_PROFILE = true
SHOW_ANALYTICS = true
SHOW_SETTINGS = true
SHOW_ALGORITHM_COMPARISON = true

[PERFORMANCE]
# Performance Tuning
ENABLE_CACHING = true
CACHE_RECOMMENDATIONS = true
BATCH_PROCESSING = true
BATCH_SIZE = 100

# Matrix Factorization
USE_MATRIX_FACTORIZATION = false
SVD_COMPONENTS = 50
SVD_ITERATIONS = 20

# Approximate Algorithms
USE_APPROXIMATE_SIMILARITY = false
APPROXIMATE_NEIGHBORS = 100

[MONITORING]
# Monitoring & Logging
ENABLE_METRICS = true
METRICS_INTERVAL = 300  # seconds
ENABLE_ALERTS = false
ALERT_THRESHOLD_ERROR_RATE = 0.05

# Performance Monitoring
TRACK_RESPONSE_TIME = true
TRACK_API_USAGE = true
TRACK_USER_BEHAVIOR = true

[FEATURES]
# Feature Toggles
ENABLE_COLLABORATIVE_FILTERING = true
ENABLE_CONTENT_BASED = true
ENABLE_HYBRID = true
ENABLE_TRENDING = true
ENABLE_POPULARITY_BOOST = true
ENABLE_DIVERSITY_OPTIMIZATION = true
ENABLE_SERENDIPITY_BOOST = true
ENABLE_NOVELTY_PROMOTION = true

# Advanced Features
ENABLE_EXPLANATIONS = true
ENABLE_FEEDBACK_LOOP = true
ENABLE_ONLINE_LEARNING = false
ENABLE_BANDIT_ALGORITHMS = false

[DATA]
# Data Configuration
DATA_SOURCE = synthetic  # synthetic, csv, database, api
SAMPLE_DATA_SIZE = 100
SYNC_DATA_INTERVAL = 3600  # seconds

# Data Quality
MIN_INTERACTION_COUNT = 1
MAX_RATING_VALUE = 10
MIN_RATING_VALUE = 1
RATING_SCALE = 1-10

[EXPORT]
# Export Settings
ENABLE_EXPORT = true
EXPORT_FORMATS = json,csv,parquet
EXPORT_PATH = ./exports

[DEBUG]
# Debug Settings
DEBUG_MODE = false
VERBOSE_LOGGING = false
PROFILE_CODE = false
MEMORY_PROFILING = false
TIME_PROFILING = false

# Test Configuration
RUN_TESTS_ON_STARTUP = false
TEST_COVERAGE_THRESHOLD = 80
